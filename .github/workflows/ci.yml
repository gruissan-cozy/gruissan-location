name: CI — vérifications

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  # Le nom du job (`build`) est référencé par la protection de branche :
  # ne pas le renommer sans mettre à jour les required_status_checks.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Point d'entrée unique du harnais : i18n → sécurité → LSP → tests → build.
      # En local, lancer la même commande avant de pousser : `npm run verify`.
      - name: Vérifier (harnais complet)
        run: npm run verify
